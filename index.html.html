<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213E;
    --paper:#EDEFF2;
    --card:#FFFFFF;
    --amber:#E8A33D;
    --sage:#6B8F71;
    --line:#D8DCE2;
    --muted:#6E7482;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 20px;
  }
  header{
    margin-bottom:22px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--muted);
    margin:0 0 2px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
  }
  .streak-bar{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .streak-pill{
    flex:1;
    background:var(--card);
    border-radius:14px;
    padding:12px 14px;
    border:1px solid var(--line);
  }
  .streak-pill .num{
    font-family:'Fraunces', serif;
    font-size:22px;
    display:block;
    line-height:1.1;
  }
  .streak-pill .lbl{
    font-size:12px;
    color:var(--muted);
  }
  section{display:none;}
  section.active{display:block;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .habit-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
  }
  .habit-row + .habit-row{
    border-top:1px solid var(--line);
  }
  .check{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid var(--sage);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background:transparent;
    transition:background .15s ease, transform .1s ease;
  }
  .check.done{
    background:var(--sage);
  }
  .check.done:active{transform:scale(0.9);}
  .check svg{width:14px;height:14px;stroke:white;fill:none;stroke-width:3;opacity:0;transition:opacity .1s ease;}
  .check.done svg{opacity:1;}
  .habit-name{
    flex:1;
    font-size:15px;
  }
  .habit-name.done{
    color:var(--muted);
    text-decoration:line-through;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    padding:4px 6px;
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  input[type=text]{
    flex:1;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .add-btn{
    border:none;
    background:var(--ink);
    color:var(--paper);
    border-radius:10px;
    padding:0 18px;
    font-size:20px;
    cursor:pointer;
    line-height:1;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:20px 0 10px;
    color:var(--ink);
  }
  .section-title:first-child{margin-top:0;}
  .empty{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:24px 0;
  }
  .day-switch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .day-switch button{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    width:36px;
    height:36px;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
  }
  .day-switch .day-label{
    font-size:14px;
    font-weight:500;
    color:var(--muted);
  }

  nav{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:inherit;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    padding:6px 0;
  }
  nav button.active{color:var(--ink); font-weight:600;}
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .loading{
    text-align:center;
    color:var(--muted);
    padding:40px 0;
    font-size:14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="dateLabel">Hari ini</p>
    <h1 id="greeting">Halo</h1>
    <div class="streak-bar">
      <div class="streak-pill">
        <span class="num" id="statDone">0/0</span>
        <span class="lbl">kebiasaan hari ini</span>
      </div>
      <div class="streak-pill">
        <span class="num" id="statStreak">0</span>
        <span class="lbl">hari beruntun</span>
      </div>
    </div>
  </header>

  <section id="habitSection" class="active">
    <div class="card" id="habitList">
      <div class="loading">Memuat…</div>
    </div>
    <div class="card">
      <div class="add-row">
        <input type="text" id="newHabitInput" placeholder="Kebiasaan baru, mis. Baca 10 menit" maxlength="60">
        <button class="add-btn" id="addHabitBtn">+</button>
      </div>
    </div>
  </section>

  <section id="plannerSection">
    <div class="day-switch">
      <button id="prevDay" aria-label="Hari sebelumnya">‹</button>
      <span class="day-label" id="plannerDayLabel"></span>
      <button id="nextDay" aria-label="Hari berikutnya">›</button>
    </div>
    <div class="card" id="taskList">
      <div class="loading">Memuat…</div>
    </div>
    <div class="card">
      <div class="add-row">
        <input type="text" id="newTaskInput" placeholder="Tambah tugas" maxlength="80">
        <button class="add-btn" id="addTaskBtn">+</button>
      </div>
    </div>
  </section>
</div>

<nav>
  <button id="navHabit" class="active">
    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
    Kebiasaan
  </button>
  <button id="navPlanner">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    Rencana
  </button>
</nav>

<script>
const $ = (id) => document.getElementById(id);
const todayKey = (d = new Date()) => {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let habits = [];       // [{id, name}]
let habitLogs = {};    // { "2026-09-27": { habitId: true } }
let plannerTasks = {}; // { "2026-09-27": [ {id, text, done} ] }
let plannerDate = new Date();

async function loadAll(){
  try { habits = JSON.parse(localStorage.getItem('alur-habits-list') || '[]'); }
  catch(e){ habits = []; }
  try { habitLogs = JSON.parse(localStorage.getItem('alur-habit-logs') || '{}'); }
  catch(e){ habitLogs = {}; }
  try { plannerTasks = JSON.parse(localStorage.getItem('alur-planner-tasks') || '{}'); }
  catch(e){ plannerTasks = {}; }
}

async function saveHabits(){
  try { localStorage.setItem('alur-habits-list', JSON.stringify(habits)); }
  catch(e){ console.error('gagal simpan habits', e); }
}
async function saveLogs(){
  try { localStorage.setItem('alur-habit-logs', JSON.stringify(habitLogs)); }
  catch(e){ console.error('gagal simpan logs', e); }
}
async function saveTasks(){
  try { localStorage.setItem('alur-planner-tasks', JSON.stringify(plannerTasks)); }
  catch(e){ console.error('gagal simpan tasks', e); }
}

function renderHeader(){
  const now = new Date();
  $('dateLabel').textContent = `${dayNames[now.getDay()]}, ${now.getDate()} ${monthNames[now.getMonth()]}`;
  const hour = now.getHours();
  $('greeting').textContent = hour < 11 ? 'Selamat pagi' : hour < 15 ? 'Selamat siang' : hour < 18 ? 'Selamat sore' : 'Selamat malam';

  const tKey = todayKey();
  const todayLog = habitLogs[tKey] || {};
  const doneCount = habits.filter(h => todayLog[h.id]).length;
  $('statDone').textContent = `${doneCount}/${habits.length}`;

  // simple streak: consecutive days (going backward from today) where all habits (if any) were fully done
  let streak = 0;
  if (habits.length > 0){
    let cursor = new Date();
    while(true){
      const key = todayKey(cursor);
      const log = habitLogs[key] || {};
      const allDone = habits.every(h => log[h.id]);
      if (allDone){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else break;
    }
  }
  $('statStreak').textContent = streak;
}

function renderHabits(){
  const tKey = todayKey();
  const todayLog = habitLogs[tKey] || {};
  const list = $('habitList');
  if (habits.length === 0){
    list.innerHTML = '<div class="empty">Belum ada kebiasaan. Tambahkan satu di bawah untuk mulai.</div>';
    return;
  }
  list.innerHTML = habits.map(h => {
    const done = !!todayLog[h.id];
    return `<div class="habit-row" data-id="${h.id}">
      <button class="check ${done ? 'done' : ''}" data-action="toggle" data-id="${h.id}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <span class="habit-name ${done ? 'done' : ''}">${escapeHtml(h.name)}</span>
      <button class="del-btn" data-action="del" data-id="${h.id}">×</button>
    </div>`;
  }).join('');
}

function renderPlanner(){
  const key = todayKey(plannerDate);
  const isToday = key === todayKey();
  $('plannerDayLabel').textContent = isToday ? 'Hari ini' : `${dayNames[plannerDate.getDay()]}, ${plannerDate.getDate()} ${monthNames[plannerDate.getMonth()]}`;
  const tasks = plannerTasks[key] || [];
  const list = $('taskList');
  if (tasks.length === 0){
    list.innerHTML = '<div class="empty">Belum ada rencana untuk hari ini.</div>';
    return;
  }
  list.innerHTML = tasks.map(t => `
    <div class="habit-row" data-id="${t.id}">
      <button class="check ${t.done ? 'done' : ''}" data-action="toggleTask" data-id="${t.id}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <span class="habit-name ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</span>
      <button class="del-btn" data-action="delTask" data-id="${t.id}">×</button>
    </div>`).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

// --- events: habits ---
$('addHabitBtn').addEventListener('click', async () => {
  const input = $('newHabitInput');
  const name = input.value.trim();
  if (!name) return;
  habits.push({ id: uid(), name });
  input.value = '';
  await saveHabits();
  renderHabits();
  renderHeader();
});
$('newHabitInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addHabitBtn').click(); });

$('habitList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const tKey = todayKey();
  if (action === 'toggle'){
    habitLogs[tKey] = habitLogs[tKey] || {};
    habitLogs[tKey][id] = !habitLogs[tKey][id];
    await saveLogs();
    renderHabits();
    renderHeader();
  } else if (action === 'del'){
    habits = habits.filter(h => h.id !== id);
    await saveHabits();
    renderHabits();
    renderHeader();
  }
});

// --- events: planner ---
$('addTaskBtn').addEventListener('click', async () => {
  const input = $('newTaskInput');
  const text = input.value.trim();
  if (!text) return;
  const key = todayKey(plannerDate);
  plannerTasks[key] = plannerTasks[key] || [];
  plannerTasks[key].push({ id: uid(), text, done: false });
  input.value = '';
  await saveTasks();
  renderPlanner();
});
$('newTaskInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('addTaskBtn').click(); });

$('taskList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const key = todayKey(plannerDate);
  const tasks = plannerTasks[key] || [];
  if (action === 'toggleTask'){
    const t = tasks.find(x => x.id === id);
    if (t) t.done = !t.done;
    await saveTasks();
    renderPlanner();
  } else if (action === 'delTask'){
    plannerTasks[key] = tasks.filter(x => x.id !== id);
    await saveTasks();
    renderPlanner();
  }
});

$('prevDay').addEventListener('click', () => {
  plannerDate.setDate(plannerDate.getDate()-1);
  renderPlanner();
});
$('nextDay').addEventListener('click', () => {
  plannerDate.setDate(plannerDate.getDate()+1);
  renderPlanner();
});

// --- nav ---
$('navHabit').addEventListener('click', () => switchTab('habit'));
$('navPlanner').addEventListener('click', () => switchTab('planner'));
function switchTab(tab){
  $('habitSection').classList.toggle('active', tab === 'habit');
  $('plannerSection').classList.toggle('active', tab === 'planner');
  $('navHabit').classList.toggle('active', tab === 'habit');
  $('navPlanner').classList.toggle('active', tab === 'planner');
}

// --- init ---
(async function init(){
  await loadAll();
  renderHeader();
  renderHabits();
  renderPlanner();
})();
</script>
</body>
</html>
